name: Setup Python
description: |
  Consistently installs python across this project. Should be used as a
  replacement for direct calls to actions/setup-python.

  Serves as the single place to update python versions over time across the
  project.
outputs:
  python-version:
    description: Version of Python installed
    value: ${{ steps.setup-python.outputs.python-version }}
runs:
  using: composite
  steps:
  - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    with:
      version: "0.13.7"
      # Must be explicit: the default "auto" disables caching on
      # pull_request_target, which several workflows here use.
      enable-cache: true
      cache-dependency-glob: "scripts/uv.lock"
  - shell: bash
    id: setup-python
    run: |
      # Single source of truth for the project's Python version.
      uv python install 3.12
      echo "python-version=3.12" >> "$GITHUB_OUTPUT"
