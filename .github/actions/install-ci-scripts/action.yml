name: Install our CI scripts
description: |
  Handles installation and caching/restore of the CI scripts in a virtualenv.
inputs:
  working-directory:
    description: Basedir in which to save / restore cache and install venv.
    default: './'
    required: false
  python-version:
    description: Installed Python version
    required: true
runs:
  using: composite
  steps:
  - name: Setup venv
    shell: bash
    working-directory: ${{ inputs.working-directory }}
    env:
      # keep ve1/ so ve1/bin/<cmd> call sites don't change
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/${{ inputs.working-directory }}/ve1
      # pin uv to the version setup-python installed
      UV_PYTHON: ${{ inputs.python-version }}
    run: |
      cd scripts
      uv sync --locked --group test
