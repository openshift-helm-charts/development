name: Metrics for owners file

on:
  push:
    branches: [ main ]

jobs:
  owners-metrics:
    name: Send Owner Metrics
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    if: github.actor == 'redhat-mercury-bot'
    env:
      SEGMENT_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_KEY }}
      SEGMENT_TEST_WRITE_KEY: ${{ secrets.SEGMENT_TEST_WRITE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: setup-python
        uses: ./.github/actions/setup-python

      - name: Install CI scripts
        uses: ./.github/actions/install-ci-scripts
        with:
          python-version: ${{ steps.setup-python.outputs.python-version }}

      # There is no pull request on a push event, so this compares the two
      # commits the event carries. Outputs are JSON arrays, one per status.
      - name: Get files changed by the push
        id: filesChangedOrModified
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.after }}
        run: |
          ./ve1/bin/pr-files --compare \
            --repository "${GITHUB_REPOSITORY}" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --format github-output

      - name: Printing changes made
        env:
          FILES_ADDED: ${{ steps.filesChangedOrModified.outputs.added }}
          FILES_MODIFIED: ${{ steps.filesChangedOrModified.outputs.modified }}
        run: |
          echo "Added:"
          echo "${FILES_ADDED}"
          echo "Modified:"
          echo "${FILES_MODIFIED}"

      # Picks the OWNERS file out of each list and passes the path on, because
      # pushowners takes one path per status, not a list.
      #
      # Every entry is considered, not just the first: a push routinely carries
      # unrelated files alongside the OWNERS file, and the index of the one we
      # want is not predictable.
      - name: Quit if owners files pushed are not
        id: check_pr_content
        env:
          FILES_ADDED: ${{ steps.filesChangedOrModified.outputs.added }}
          FILES_MODIFIED: ${{ steps.filesChangedOrModified.outputs.modified }}
        run: |
          set -euo pipefail
          select_owners() {
            jq -r 'map(select(endswith("/OWNERS"))) | first // ""' <<< "$1"
          }
          ADDED_OWNERS_FILE="$(select_owners "${FILES_ADDED}")"
          MODIFIED_OWNERS_FILE="$(select_owners "${FILES_MODIFIED}")"

          if [ -n "${ADDED_OWNERS_FILE}" ] || [ -n "${MODIFIED_OWNERS_FILE}" ]; then
              echo "OWNERS files have been modified or added"
              echo "collect_metrics=true" >> $GITHUB_OUTPUT
          else
              echo "OWNERS files not pushed"
              echo "collect_metrics=false" >> $GITHUB_OUTPUT
          fi
          echo "added-owners-file=${ADDED_OWNERS_FILE}" >> $GITHUB_OUTPUT
          echo "modified-owners-file=${MODIFIED_OWNERS_FILE}" >> $GITHUB_OUTPUT

      - name: Add owner metrics
        if: ${{ steps.check_pr_content.outputs.collect_metrics == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TODO: consolidate these two keys based on environment.
          SEGMENT_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_KEY }}
          SEGMENT_WRITE_TEST_KEY: ${{ secrets.SEGMENT_TEST_WRITE_KEY }}
          # A single path each, not the JSON lists: pushowners treats its
          # --added / --modified values as file paths to read.
          ADDED: ${{ steps.check_pr_content.outputs.added-owners-file }}
          MODIFIED: ${{ steps.check_pr_content.outputs.modified-owners-file }}
        run: |
          if [ $GITHUB_REPOSITORY == "openshift-helm-charts/charts" ]; then
              WRITE_KEY="${SEGMENT_WRITE_KEY}"
              ID_PREFIX="helm-metric-pr"
              echo "Use segment production write key"
          else
              WRITE_KEY="${SEGMENT_WRITE_TEST_KEY}"
              ID_PREFIX="helm-test-metric-pr"
              echo "Use segment test write key"
          fi

          if [ "${WRITE_KEY}" != "" ]; then
              echo "add owner metric"
              ve1/bin/pushowners --write-key="${WRITE_KEY}" \
                                --metric-type="push_request" \
                                --repository="${GITHUB_REPOSITORY}" \
                                --added="${ADDED}" \
                                --modified="${MODIFIED}" \
                                --prefix="${ID_PREFIX}"
          else
              echo "Do not collect metrics, required segment write key is not set"
          fi
