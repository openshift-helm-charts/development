name: Python Test

on:
  pull_request:
    paths:
    # The modules that currently provide unit tests
    - 'scripts/src/submission/*'
    - 'scripts/src/report/*'
    - 'scripts/src/pullrequest/*'
    - 'scripts/requirements.txt'
    - 'scripts/pyproject.toml'
    - 'scripts/uv.lock'

jobs:
  enforce:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        # Keep in step with the uv that generated scripts/uv.lock: the
        # lockfile's `revision` is format-versioned per uv release and an
        # older uv cannot read a newer revision.
        version: "0.13.7"
        cache-dependency-glob: "scripts/uv.lock"
    - name: Verify lockfile is current
      working-directory: scripts
      run: uv lock --check
    - name: Set up Python
      id: setup-python
      uses: ./.github/actions/setup-python
    - name: Install CI scripts
      uses: ./.github/actions/install-ci-scripts
      with:
        python-version: ${{ steps.setup-python.outputs.python-version }}
    - name: Run pytest
      run: |
        ./ve1/bin/pytest scripts/src/submission/ scripts/src/report/ scripts/src/pullrequest/
